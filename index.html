<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Ícones — KRONA</title>
<style>
  body{font-family:sans-serif;background:#060A13;color:#E2E8F0;padding:30px;text-align:center}
  h1{color:#D4A84B;margin-bottom:20px}
  button{background:#D4A84B;color:#060A13;border:none;padding:12px 28px;border-radius:8px;
    font-size:15px;font-weight:700;cursor:pointer;margin:10px}
  button:hover{background:#E8C46E}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:20px}
  .item{background:#101B2E;border:1px solid #1E3050;border-radius:10px;padding:12px;text-align:center}
  canvas{border-radius:8px;display:block;margin:0 auto 6px}
  small{color:#64748B;font-size:11px}
  a{color:#D4A84B;text-decoration:none;font-size:12px;font-weight:700}
</style>
</head>
<body>
<h1>🌾 Gerador de Ícones KRONA</h1>
<p style="color:#94A3B8;margin-bottom:20px">Gera todos os tamanhos necessários para o PWA/APK</p>
<button onclick="generateAll()">⬇ Gerar e Baixar Todos os Ícones</button>
<div class="grid" id="grid"></div>

<script>
// POLYFILL para roundRect (corrige o erro)
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    return this;
  };
}

const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0D1525');
  grad.addColorStop(1, '#152238');
  ctx.fillStyle = grad;
  ctx.roundRect(0, 0, size, size, size * 0.2);
  ctx.fill();

  // Borda dourada
  ctx.strokeStyle = '#D4A84B';
  ctx.lineWidth = Math.max(2, size * 0.025);
  ctx.roundRect(ctx.lineWidth/2, ctx.lineWidth/2, size-ctx.lineWidth, size-ctx.lineWidth, size * 0.18);
  ctx.stroke();

  // Letra K
  const fs = size * 0.52;
  ctx.font = `900 ${fs}px 'Inter', Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tGrad = ctx.createLinearGradient(0, size*0.2, 0, size*0.8);
  tGrad.addColorStop(0, '#E8C46E');
  tGrad.addColorStop(1, '#C49A3C');
  ctx.fillStyle = tGrad;
  ctx.fillText('K', size/2, size/2 + size*0.03);

  // "KRONA" para tamanhos >= 128
  if(size >= 128) {
    ctx.font = `800 ${size * 0.095}px 'Inter', Arial, sans-serif`;
    ctx.fillStyle = 'rgba(212,168,75,0.6)';
    ctx.fillText('KRONA', size/2, size * 0.84);
  }
  return canvas;
}

function generateAll() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  SIZES.forEach(size => {
    const canvas = drawIcon(size);
    const item = document.createElement('div');
    item.className = 'item';
    const preview = document.createElement('canvas');
    preview.width = preview.height = Math.min(size, 96);
    const pCtx = preview.getContext('2d');
    pCtx.drawImage(canvas, 0, 0, preview.width, preview.height);
    item.appendChild(preview);
    item.innerHTML += `<small>${size}×${size}</small><br>`;
    const link = document.createElement('a');
    link.textContent = '⬇ Baixar';
    link.href = canvas.toDataURL('image/png');
    link.download = `icon-${size}.png`;
    item.appendChild(link);
    grid.appendChild(item);
    setTimeout(() => link.click(), SIZES.indexOf(size) * 300);
  });
}
</script>
</body>
</html>
