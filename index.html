<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060A13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KRONA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="msapplication-TileImage" content="icons/icon-144.png">
<meta name="msapplication-TileColor" content="#060A13">
<title>KRONA Analytics — Simulado Agronegócio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ========== SEU CSS ORIGINAL (mantido na íntegra) ========== */
/* Todo o seu CSS (de \:root até o final do estilo) deve ser copiado aqui.
   O arquivo original é muito grande; cole exatamente o que você tinha no seu index.html que funcionava. */
</style>
</head>
<body>
<!-- TODO O SEU HTML (header, módulos, views, etc.) permanece igual -->
<!-- ... (conteúdo completo do seu body) ... -->

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- BOTÃO DE INSTALAÇÃO CUSTOMIZADO (opcional, adicionado) -->
<div id="installBtn" style="position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #D4A84B; color: #060A13; border: none; border-radius: 40px; padding: 10px 20px; font-weight: bold; font-size: 14px; cursor: pointer; z-index: 300; display: none; box-shadow: 0 2px 12px rgba(0,0,0,0.3);">
  📲 Instalar App KRONA
</div>

<script>
// ========== BANCO DE QUESTÕES, FUNÇÕES DO APP, ETC. ==========
// Mantenha exatamente todo o seu JavaScript original (QUESTIONS_DB, startQuiz, etc.)
// A única alteração é a correção do escopo do Service Worker.
// ================================================================

// ========== TELEGRAM WEBAPP INIT (original) ==========
const tg = window.Telegram?.WebApp || {
  ready:()=>{}, expand:()=>{}, close:()=>{},
  setHeaderColor:()=>{}, setBackgroundColor:()=>{},
  sendData:(d)=>console.log('sendData:',d),
  showConfirm:(msg,cb)=>{cb(confirm(msg))},
  showAlert:(msg,cb)=>{alert(msg);cb&&cb()},
  HapticFeedback:{impactOccurred:()=>{},notificationOccurred:()=>{}},
  initDataUnsafe:{user:null}
};
tg.ready();
tg.expand();
tg.setHeaderColor('#0B1120');
tg.setBackgroundColor('#060A13');

// ========== PWA – REGISTRO DO SERVICE WORKER (CORRIGIDO) ==========
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => console.log('[KRONA] SW ativo, escopo:', reg.scope))
      .catch(err => console.warn('[KRONA] SW falhou:', err));
  });
}

// ========== BOTÃO DE INSTALAÇÃO PERSONALIZADO ==========
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'block';
});
document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  document.getElementById('installBtn').style.display = 'none';
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`Instalação: ${outcome}`);
  deferredPrompt = null;
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
</script>
</body>
</html>
