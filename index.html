<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KRONA">
<meta name="description" content="KRONA Analytics — Plataforma de estudos SENAR">
<link rel="manifest" href="./manifest.json">
<title>KRONA Analytics — Aluno + Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0B1120;color:#F8FAFC}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;background:#0F172A;border-right:1px solid rgba(255,255,255,.08);padding:24px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.main{flex:1;padding:24px;position:relative;overflow-y:auto;min-height:100vh}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;cursor:pointer;color:#94A3B8;margin-bottom:4px;transition:.2s}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(251,191,36,.1);color:#FBBF24}
.card{background:#1E293B;border-radius:20px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.06)}
.btn{background:#FBBF24;color:#0B1120;border:none;border-radius:40px;padding:10px 20px;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{background:#F59E0B;transform:scale(1.02)}
.btn-outline{background:transparent;border:1px solid #334155;color:#CBD5E1;border-radius:40px;padding:10px 20px;font-weight:600;cursor:pointer;transition:.2s}
.btn-outline:hover{background:#334155}
input,select{width:100%;padding:12px;background:#0F172A;border:1px solid #334155;border-radius:16px;color:#fff;margin-bottom:12px;font-family:'Inter',sans-serif}
input:focus,select:focus{outline:none;border-color:#FBBF24}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:1px solid #334155}
th{color:#94A3B8;font-size:13px}
.badge{background:#10B98120;color:#10B981;padding:4px 12px;border-radius:20px;font-size:12px;display:inline-block}
.status-pending{background:#F59E0B20;color:#F59E0B}
.progress-bar{height:8px;background:#334155;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#FBBF24,#F59E0B);width:0%;border-radius:10px;transition:width .5s ease}
.view{display:none}
.view.active{display:block}
.login-container{max-width:420px;margin:60px auto;background:#1E293B;border-radius:28px;padding:40px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.logo-mark{display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.logo-mark svg{filter:drop-shadow(0 0 20px rgba(251,191,36,.5))}
.logo-sidebar{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo-sidebar svg{flex-shrink:0}
.btn-sair-topo{position:fixed;top:16px;right:16px;background:#EF4444;color:white;border:none;border-radius:40px;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:.2s}
.btn-sair-topo:hover{background:#DC2626;transform:scale(1.02)}
.pwa-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1E293B,#0F172A);border-top:1px solid rgba(251,191,36,.3);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;z-index:9000;gap:16px}
.pwa-banner-text{font-size:14px;font-weight:600;color:#F8FAFC}
.pwa-banner-sub{font-size:12px;color:#94A3B8;margin-top:2px}
.pwa-banner-btns{display:flex;gap:8px;flex-shrink:0}
.quiz-option-btn{width:100%;text-align:left;background:#0F172A;border:1px solid #334155;border-radius:12px;padding:14px 16px;color:#F8FAFC;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:10px;transition:.2s;display:flex;align-items:center;gap:12px}
.quiz-option-btn.correct{background:#10B98120;border-color:#10B981;color:#10B981}
.quiz-option-btn.wrong{background:#EF444420;border-color:#EF4444;color:#EF4444}
.quiz-option-letter{width:28px;height:28px;border-radius:8px;background:#334155;display:flex;align-items:center;justify-content:center;font-weight:700}
.quiz-feedback-box{background:#0F172A;border-radius:12px;padding:16px;margin-top:12px;border-left:3px solid #FBBF24}
.toast-success{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#10B981;color:white;padding:12px 24px;border-radius:60px;font-weight:800;z-index:9999;animation:fadeInOut 2.5s ease forwards}
.xp-toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);background:#FBBF24;color:#0B1120;padding:8px 20px;border-radius:60px;font-weight:800;z-index:9999;animation:fadeInOut 2s forwards}
@keyframes fadeInOut{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998}
@media (max-width:768px){.sidebar{display:none}.main{padding:16px}}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<!-- LOGIN -->
<div id="globalLogin" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1120">
  <div class="login-container">
    <div class="logo-mark"><svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="96" height="96" rx="24" fill="#0F172A"/><path d="M22 18 L22 78 L34 78 L34 56 L55 78 L70 78 L44 50 L68 18 L53 18 L34 43 L34 18 Z" fill="#FBBF24"/><circle cx="72" cy="26" r="6" fill="#FBBF24" opacity=".7"/></svg></div>
    <div style="font-size:28px;font-weight:900">KRONA Analytics</div>
    <div style="color:#94A3B8;margin-bottom:32px">Plataforma de estudos SENAR</div>
    <input type="text" id="studentName" placeholder="Seu nome completo" value="Aluno">
    <button class="btn" style="width:100%;margin-bottom:12px" onclick="loginAsStudent()">👨‍🌾 Entrar como Aluno</button>
    <button class="btn-outline" style="width:100%" onclick="showAdminLogin()">🔐 Acesso Administrativo</button>
    <div id="adminLoginDiv" style="display:none;margin-top:20px">
      <input type="email" id="adminEmail" placeholder="admin@krona.com" value="admin@krona.com">
      <input type="password" id="adminPassword" placeholder="Senha" value="123456">
      <button class="btn" style="width:100%;margin-bottom:8px" onclick="loginAsAdmin()">Entrar no Admin</button>
      <button class="btn-outline" style="width:100%" onclick="hideAdminLogin()">Voltar</button>
    </div>
  </div>
</div>

<!-- ÁREA DO ALUNO -->
<div id="studentApp" style="display:none">
  <div class="app">
    <div class="sidebar">
      <div class="logo-sidebar"><svg width="36" height="36" viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="24" fill="#0F172A"/><path d="M22 18 L22 78 L34 78 L34 56 L55 78 L70 78 L44 50 L68 18 L53 18 L34 43 L34 18 Z" fill="#FBBF24"/><circle cx="72" cy="26" r="6" fill="#FBBF24"/></svg><div><div style="font-size:16px;font-weight:800">KRONA</div><div style="font-size:10px;color:#94A3B8">Aluno</div></div></div>
      <div class="nav-item active" onclick="studentNavTo('dashboard')">📊 Dashboard</div>
      <div class="nav-item" onclick="studentNavTo('materias')">📚 Matérias & Temas</div>
      <div class="nav-item" onclick="studentNavTo('simulados')">📝 Simulados</div>
      <div class="nav-item" onclick="studentNavTo('ranking')">🏆 Ranking</div>
      <div class="nav-item" onclick="studentNavTo('erros')">📓 Caderno de Erros</div>
      <div class="nav-item" onclick="studentNavTo('perfil')">👤 Perfil</div>
      <div class="nav-item" onclick="studentNavTo('configuracoes')">⚙️ Configurações</div>
      <div style="margin-top:auto;padding-top:20px"><button class="btn-outline" style="width:100%" onclick="logout()">Sair</button></div>
    </div>
    <div class="main">
      <button class="btn-sair-topo" onclick="logout()">🚪 Sair</button>
      <div id="studentDashboard" class="view active"><div id="studentStats"></div></div>
      <div id="studentMaterias" class="view"><div id="materiasContent"></div></div>
      <div id="studentSimulados" class="view"><div id="simuladosList"></div></div>
      <div id="studentRanking" class="view"><div id="rankingList"></div></div>
      <div id="studentErros" class="view"><div id="errosList"></div></div>
      <div id="studentPerfil" class="view"><div id="perfilContent"></div></div>
      <div id="studentConfiguracoes" class="view"><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:20px"><div><strong>🎨 Efeitos Visuais</strong></div><label class="switch"><input type="checkbox" id="toggleVisualEffects" onchange="toggleVisualEffects(this.checked)"><span class="slider"></span></label></div><div style="display:flex;justify-content:space-between"><div><strong>🔊 Sons do Sistema</strong></div><label class="switch"><input type="checkbox" id="toggleSounds" onchange="toggleSoundFromSettings(this.checked)"><span class="slider"></span></label></div></div></div>
    </div>
  </div>
</div>

<!-- ÁREA DO ADMIN -->
<div id="adminApp" style="display:none">
  <div class="app">
    <div class="sidebar">
      <div class="logo-sidebar"><svg width="36" height="36" viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="24" fill="#0F172A"/><path d="M22 18 L22 78 L34 78 L34 56 L55 78 L70 78 L44 50 L68 18 L53 18 L34 43 L34 18 Z" fill="#FBBF24"/><circle cx="72" cy="26" r="6" fill="#FBBF24"/></svg><div><div style="font-size:16px;font-weight:800">KRONA</div><div style="font-size:10px;color:#94A3B8">Admin</div></div></div>
      <div class="nav-item active" onclick="adminNavTo('dashboard')">📊 Dashboard</div>
      <div class="nav-item" onclick="adminNavTo('modulos')">📦 Módulos</div>
      <div class="nav-item" onclick="adminNavTo('simulados')">📝 Simulados</div>
      <div class="nav-item" onclick="adminNavTo('alunos')">👥 Alunos</div>
      <div style="margin-top:auto;padding-top:20px"><button class="btn-outline" style="width:100%" onclick="logout()">Sair</button></div>
    </div>
    <div class="main">
      <button class="btn-sair-topo" onclick="logout()">🚪 Sair</button>
      <div id="adminDashboard" class="view active"><div id="adminStats"></div></div>
      <div id="adminModulos" class="view"><div id="modulosAdminList"></div><button class="btn" onclick="addModule()">+ Novo Módulo</button></div>
      <div id="adminSimulados" class="view"><div id="simuladosAdminList"></div></div>
      <div id="adminAlunos" class="view"><div id="alunosList"></div></div>
    </div>
  </div>
</div>

<!-- TELA DO QUIZ -->
<div id="quizScreen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0B1120;z-index:10000;display:none;flex-direction:column">
  <div style="background:#1E293B;padding:14px 20px;display:flex;justify-content:space-between;align-items:center">
    <button class="btn-outline" onclick="quitQuiz()">← Sair</button>
    <div><strong id="quizTimer" style="color:#FBBF24">⏱ 5:00</strong></div>
    <div><span style="color:#10B981">✅ <span id="quizAcertos">0</span></span> <span style="color:#EF4444">❌ <span id="quizErros">0</span></span></div>
  </div>
  <div style="padding:12px 20px;background:#0F172A">
    <div class="progress-bar"><div class="progress-fill" id="quizProgressFill"></div></div>
    <div style="text-align:right;font-size:12px"><span id="quizProgressCt">1/10</span></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:20px" id="quizBody"></div>
</div>

<script>
// ======================== BANCO DE QUESTÕES (Temas 1 a 6) ========================
const bancoQuestoes = {
  "Segurança dos alimentos, alimentar e nutricional": [
    { p:"Qual capacidade técnica é destacada ao final do Tema 1?", ops:{A:"Aplicar legislações sanitárias",B:"Reconhecer a importância dos serviços de inspeção sanitária",C:"Executar controle de perigos",D:"Diferenciar segurança dos alimentos",E:"Implantar APPCC"}, c:"B", exp:"Página 13: 'reconhecer a importância dos serviços de inspeção sanitária de qualidade dos alimentos.'" },
    { p:"Sobre a origem da expressão 'segurança dos alimentos':", ops:{A:"Criada pela OMS",B:"Do inglês 'food safety', abrange da produção à mesa",C:"Conceito francês",D:"Portaria Mapa 46/1998",E:"Latim 'securitas ciborum'"}, c:"B", exp:"Página 14: 'proveniente da língua inglesa food safety... desde a produção até a mesa.'" },
    { p:"Qual afirmativa é falsa sobre segurança dos alimentos vs segurança alimentar?", ops:{A:"Segurança dos alimentos controla perigos",B:"Segurança alimentar é direito com políticas públicas",C:"Dimensão nutricional trata da disponibilidade (invertido)",D:"Objetivo é acesso a alimentos nutritivos",E:"Segurança dos alimentos abrange controle de perigos"}, c:"C", exp:"Inverte os conceitos: dimensão alimentar = disponibilidade; nutricional = escolha/preparo." }
  ],
  "Aspectos relacionados às legislações sanitárias dos alimentos": [
    { p:"Capacidades técnicas do Tema 2:", ops:{A:"Apenas reconhecer inspeção",B:"Aplicar legislações vigentes e compreender normas da cadeia",C:"Implementar APPCC",D:"Coordenar SIF/SIE/SIM",E:"Diferenciar conceitos"}, c:"B", exp:"Página 18." }
  ],
  "Microbiologia de alimentos": [
    { p:"Características das bactérias:", ops:{A:"Reprodução por divisão 15-20 min, proliferam em proteínas",B:"Só com oxigênio",C:"Reprodução por esporos 24h",D:"Exclusivamente patogênicas",E:"Requerem pH<4"}, c:"A", exp:"Páginas 32-35." }
  ],
  "Perigos em alimentos": [
    { p:"Capacidades do Tema 4:", ops:{A:"Reconhecer inspeção",B:"Acompanhar BPA, APPCC, ISO, 5S e tecnologias",C:"Controlar perigos",D:"Diferenciar segurança",E:"Controlar Aa"}, c:"B", exp:"Página 51." }
  ],
  "Doenças de origem alimentar (DTA)": [
    { p:"Classificação das DTA:", ops:{A:"Infecção: toxina pré-formada",B:"Infecção: microrganismos intactos se multiplicam; Intoxicação: toxina pré-formada; Toxinfecção: toxina produzida no organismo",C:"Infecção só por vírus",D:"Intoxicação por metais",E:"Termos sinônimos"}, c:"B", exp:"Páginas 64-65." }
  ],
  "Sistemas de gestão da segurança dos alimentos": [
    { p:"Capacidades do Tema 6:", ops:{A:"Acompanhar BPA, APPCC, ISO, 5S; aplicar estratégias de armazenagem; conhecer tecnologias",B:"Reconhecer inspeção",C:"Implantar APPCC",D:"Controlar perigos",E:"Apenas ISO e 5S"}, c:"A", exp:"Página 81." }
  ]
};

// ======================== DADOS GLOBAIS ========================
let modules = [
  { name:"Segurança dos Alimentos", temas:["Segurança dos alimentos, alimentar e nutricional"] },
  { name:"Legislação Sanitária", temas:["Aspectos relacionados às legislações sanitárias dos alimentos"] },
  { name:"Microbiologia", temas:["Microbiologia de alimentos"] },
  { name:"Perigos em Alimentos", temas:["Perigos em alimentos"] },
  { name:"Doenças de Origem Alimentar", temas:["Doenças de origem alimentar (DTA)"] },
  { name:"Gestão da Segurança", temas:["Sistemas de gestão da segurança dos alimentos"] }
];
let simulados = {};
let alunos = [{ name:"Aluno", xp:0 }];
let currentSession = null;
let soundEnabled = true, visualEffectsEnabled = true;

function loadAllData() {
  const saved = localStorage.getItem("krona_simulados");
  if(saved) simulados = JSON.parse(saved);
  else {
    for(let tema in bancoQuestoes) {
      simulados[tema] = bancoQuestoes[tema].map(q => ({ pergunta: q.p, opcoes: q.ops, correta: q.c, explicacao: q.exp }));
    }
  }
  const savedAlunos = localStorage.getItem("krona_alunos");
  if(savedAlunos) alunos = JSON.parse(savedAlunos);
}
function saveAll() { localStorage.setItem("krona_simulados", JSON.stringify(simulados)); localStorage.setItem("krona_alunos", JSON.stringify(alunos)); }
loadAllData();

// ======================== LOGIN ========================
function loginAsStudent() {
  let name = document.getElementById("studentName").value.trim() || "Aluno";
  currentSession = { type:"student", user:{ name } };
  document.getElementById("globalLogin").style.display = "none";
  document.getElementById("studentApp").style.display = "flex";
  if(!alunos.find(a=>a.name===name)) alunos.push({ name, xp:0 });
  saveAll();
  renderStudentDashboard();
  studentNavTo("dashboard");
}
function loginAsAdmin() {
  let email = document.getElementById("adminEmail").value.trim();
  let pass = document.getElementById("adminPassword").value.trim();
  if(email==="admin@krona.com" && pass==="123456") {
    currentSession = { type:"admin", user:{ name:"Administrador" } };
    document.getElementById("globalLogin").style.display = "none";
    document.getElementById("adminApp").style.display = "flex";
    renderAdminDashboard();
    adminNavTo("dashboard");
  } else alert("Credenciais inválidas");
}
function showAdminLogin() { document.getElementById("adminLoginDiv").style.display = "block"; }
function hideAdminLogin() { document.getElementById("adminLoginDiv").style.display = "none"; }
function logout() { localStorage.clear(); location.reload(); }

// ======================== ALUNO ========================
function studentNavTo(view) {
  document.querySelectorAll("#studentApp .view").forEach(v=>v.classList.remove("active"));
  document.getElementById("student"+view.charAt(0).toUpperCase()+view.slice(1)).classList.add("active");
  if(view==="dashboard") renderStudentDashboard();
  if(view==="materias") renderStudentMaterias();
  if(view==="simulados") renderStudentSimulados();
  if(view==="ranking") renderStudentRanking();
  if(view==="erros") renderStudentErros();
  if(view==="perfil") renderStudentPerfil();
}
function renderStudentDashboard() {
  let totalXp = alunos.find(a=>a.name===currentSession.user.name)?.xp || 0;
  document.getElementById("studentStats").innerHTML = `<div class="card"><h2>Bem-vindo, ${currentSession.user.name}</h2><div>XP: ${totalXp}</div><div class="badge">Liga: ${totalXp>500?"Ouro":"Bronze"}</div></div>`;
}
function renderStudentMaterias() {
  let html = "";
  modules.forEach(mod => {
    html += `<div class="card"><h3>${mod.name}</h3>`;
    mod.temas.forEach(tema => {
      let qtd = simulados[tema]?.length || 0;
      html += `<div style="margin:8px 0"><strong>${tema}</strong> <button class="btn" style="padding:4px 12px" onclick="startQuiz('${tema}')">📝 Simulado (${qtd}q)</button></div>`;
    });
    html += `</div>`;
  });
  document.getElementById("materiasContent").innerHTML = html;
}
function renderStudentSimulados() {
  let html = `<div class="card"><h3>Simulados Disponíveis</h3>`;
  for(let tema in simulados) {
    html += `<div><strong>${tema}</strong> - ${simulados[tema].length} questões <button class="btn" onclick="startQuiz('${tema}')">Iniciar</button></div>`;
  }
  html += `</div>`;
  document.getElementById("simuladosList").innerHTML = html;
}
function renderStudentRanking() {
  let sorted = [...alunos].sort((a,b)=>b.xp - a.xp);
  let html = `<div class="card"><h3>Ranking</h3><ol>`;
  sorted.forEach((a,i)=> html += `<li>${a.name} - ${a.xp} XP</li>`);
  html += `</ol></div>`;
  document.getElementById("rankingList").innerHTML = html;
}
function renderStudentErros() { document.getElementById("errosList").innerHTML = `<div class="card">Caderno de erros em breve...</div>`; }
function renderStudentPerfil() { document.getElementById("perfilContent").innerHTML = `<div class="card">Perfil de ${currentSession.user.name}</div>`; }

// ======================== QUIZ ========================
let currentQuiz = null;
function startQuiz(tema) {
  let questions = simulados[tema];
  if(!questions || !questions.length) { alert("Nenhuma questão para este tema."); return; }
  currentQuiz = { tema, questions, idx:0, acertos:0, erros:0, timerSec:300, answered:false, finished:false };
  renderQuiz();
  startQuizTimer();
}
function renderQuiz() {
  let q = currentQuiz.questions[currentQuiz.idx];
  let total = currentQuiz.questions.length;
  document.getElementById("quizProgressFill").style.width = (currentQuiz.idx/total*100)+"%";
  document.getElementById("quizProgressCt").innerText = `${currentQuiz.idx+1}/${total}`;
  document.getElementById("quizAcertos").innerText = currentQuiz.acertos;
  document.getElementById("quizErros").innerText = currentQuiz.erros;
  let letters = Object.keys(q.opcoes);
  let html = `<div class="card"><strong>${q.pergunta}</strong></div>`;
  letters.forEach(l => html += `<div class="quiz-option-btn" onclick="selectAnswer('${l}')"><span class="quiz-option-letter">${l}</span>${q.opcoes[l]}</div>`);
  html += `<div id="quizFeedback"></div>`;
  document.getElementById("quizBody").innerHTML = html;
  document.getElementById("quizScreen").style.display = "flex";
  currentQuiz.answered = false;
}
function startQuizTimer() {
  if(currentQuiz.timerInterval) clearInterval(currentQuiz.timerInterval);
  currentQuiz.timerInterval = setInterval(()=>{
    if(currentQuiz.finished) return;
    if(currentQuiz.timerSec <= 0) { finishQuiz(); return; }
    currentQuiz.timerSec--;
    let m = Math.floor(currentQuiz.timerSec/60), s = currentQuiz.timerSec%60;
    document.getElementById("quizTimer").innerText = `⏱ ${m}:${s<10?"0"+s:s}`;
  },1000);
}
function selectAnswer(letter) {
  if(currentQuiz.answered || currentQuiz.finished) return;
  let q = currentQuiz.questions[currentQuiz.idx];
  let isCorrect = (letter === q.correta);
  currentQuiz.answered = true;
  if(isCorrect) {
    currentQuiz.acertos++;
    playCorrectSound();
  } else {
    currentQuiz.erros++;
    playErrorSound();
  }
  // mostrar feedback
  let fb = document.getElementById("quizFeedback");
  fb.innerHTML = `<div class="quiz-feedback-box"><strong>${isCorrect?"✅ Correto!":"❌ Errado! Resposta: "+q.correta}</strong><br>${q.explicacao}</div>`;
  setTimeout(()=>{
    currentQuiz.idx++;
    if(currentQuiz.idx >= currentQuiz.questions.length) finishQuiz();
    else renderQuiz();
  },2000);
}
function finishQuiz() {
  clearInterval(currentQuiz.timerInterval);
  currentQuiz.finished = true;
  let aluno = alunos.find(a=>a.name===currentSession.user.name);
  if(aluno) aluno.xp += currentQuiz.acertos * 10;
  saveAll();
  document.getElementById("quizScreen").style.display = "none";
  alert(`Simulado finalizado! Acertos: ${currentQuiz.acertos}/${currentQuiz.questions.length}`);
  renderStudentDashboard();
}
function quitQuiz() { if(confirm("Sair?")){ clearInterval(currentQuiz.timerInterval); document.getElementById("quizScreen").style.display="none"; } }

function playCorrectSound() { if(soundEnabled) new Audio("data:audio/wav;base64,U3RlcmVv...").play().catch(e=>{}); }
function playErrorSound() { if(soundEnabled) new Audio("data:audio/wav;base64,U3RlcmVv...").play().catch(e=>{}); }
function toggleSoundFromSettings(v) { soundEnabled = v; localStorage.setItem("krona_sound", v); }
function toggleVisualEffects(v) { visualEffectsEnabled = v; localStorage.setItem("krona_visual", v); }

// ======================== ADMIN ========================
function adminNavTo(view) {
  document.querySelectorAll("#adminApp .view").forEach(v=>v.classList.remove("active"));
  document.getElementById("admin"+view.charAt(0).toUpperCase()+view.slice(1)).classList.add("active");
  if(view==="dashboard") renderAdminDashboard();
  if(view==="modulos") renderAdminModulos();
  if(view==="simulados") renderAdminSimulados();
  if(view==="alunos") renderAdminAlunos();
}
function renderAdminDashboard() { document.getElementById("adminStats").innerHTML = `<div class="card">Total de módulos: ${modules.length}<br>Total de simulados: ${Object.keys(simulados).length}</div>`; }
function renderAdminModulos() {
  let html = "";
  modules.forEach((m,i)=>html+=`<div class="card"><h3>${m.name}</h3><button class="btn-outline" onclick="editModule(${i})">Editar</button><button class="btn-outline" onclick="deleteModule(${i})">Excluir</button><button class="btn-outline" onclick="addTema(${i})">+ Tema</button></div>`);
  document.getElementById("modulosAdminList").innerHTML = html;
}
function addModule() { let n=prompt("Nome do módulo:"); if(n) modules.push({name:n,temas:[]}); saveAll(); renderAdminModulos(); }
function editModule(i) { let n=prompt("Novo nome:", modules[i].name); if(n) modules[i].name=n; saveAll(); renderAdminModulos(); }
function deleteModule(i) { if(confirm("Remover?")) modules.splice(i,1); saveAll(); renderAdminModulos(); }
function addTema(i) { let t=prompt("Nome do tema:"); if(t && !modules[i].temas.includes(t)) modules[i].temas.push(t); saveAll(); renderAdminModulos(); }
function renderAdminSimulados() {
  let html = `<div class="card"><h3>Gerenciar Questões</h3>`;
  for(let tema in simulados) {
    html += `<div><strong>${tema}</strong> (${simulados[tema].length} questões) <button class="btn-outline" onclick="addQuestionToTema('${tema}')">+ Adicionar</button> <button class="btn-outline" onclick="deleteSimulado('${tema}')">🗑️</button></div>`;
  }
  html += `<button class="btn" onclick="addNewSimulado()">+ Criar novo simulado</button></div>`;
  document.getElementById("simuladosAdminList").innerHTML = html;
}
function addNewSimulado() { let t=prompt("Nome do novo tema:"); if(t && !simulados[t]) simulados[t]=[]; saveAll(); renderAdminSimulados(); }
function deleteSimulado(tema) { if(confirm(`Excluir ${tema}?`)) delete simulados[tema]; saveAll(); renderAdminSimulados(); }
function addQuestionToTema(tema) {
  let pergunta = prompt("Pergunta:");
  if(!pergunta) return;
  let opcoes = {};
  for(let l of ["A","B","C","D","E"]) { let txt = prompt(`Opção ${l}:`); if(txt) opcoes[l]=txt; }
  let correta = prompt("Letra correta (A-E):").toUpperCase();
  let explicacao = prompt("Explicação:");
  if(Object.keys(opcoes).length && correta) {
    simulados[tema].push({pergunta, opcoes, correta, explicacao});
    saveAll();
    renderAdminSimulados();
  }
}
function renderAdminAlunos() {
  let html = `<div class="card"><h3>Alunos</h3><ul>`;
  alunos.forEach(a=> html += `<li>${a.name} - XP: ${a.xp}</li>`);
  html += `</ul><button class="btn" onclick="addAluno()">+ Adicionar Aluno</button></div>`;
  document.getElementById("alunosList").innerHTML = html;
}
function addAluno() { let n=prompt("Nome:"); if(n) alunos.push({name:n,xp:0}); saveAll(); renderAdminAlunos(); }

// inicialização
(function checkSession() {
  let saved = localStorage.getItem("krona_session");
  if(saved) { try{ let s=JSON.parse(saved); if(s.type==="student") loginAsStudent(); else if(s.type==="admin") loginAsAdmin(); }catch(e){} }
})();
loadAllData();
</script>
